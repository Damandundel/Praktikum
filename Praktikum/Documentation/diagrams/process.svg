<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-labelledby="t d" font-family="'Segoe UI', Arial, sans-serif">
  <title id="t">Основен процес на Praktikum</title>
  <desc id="d">Работодателят публикува позиция, ученикът кандидатства, координаторът одобрява или отхвърля. След одобрение се назначава наставник и график, ученикът води дневник, наставникът потвърждава или отхвърля записите, часовете се броят, следва оценка по критерии и справка.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="900" height="590" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Основен процес: от позицията до оценката</text>

  <!-- Ред 1 -->
  <g font-size="13.5" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="90" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="150" y="118">Работодателят</text><text x="150" y="137">публикува позиция</text>

    <rect x="340" y="90" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="450" y="118">Ученикът</text><text x="450" y="137">кандидатства</text>

    <polygon points="750,60 870,122 750,184 630,122" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/>
    <text x="750" y="118">Координаторът</text><text x="750" y="137">разглежда</text>
  </g>
  <line x1="260" y1="122" x2="338" y2="122" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="122" x2="628" y2="122" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- отхвърлена: връща се към кандидатстване -->
  <path d="M750,60 C750,40 450,40 450,88" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="62" text-anchor="middle" font-size="12.5" fill="#b91c1c" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">отхвърлена (ученикът вижда причината)</text>

  <!-- одобрена -->
  <line x1="750" y1="184" x2="750" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="762" y="232" font-size="12.5" fill="#15803d">одобрена</text>

  <!-- Ред 2 -->
  <g font-size="13.5" text-anchor="middle" fill="#0f172a">
    <rect x="640" y="270" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="750" y="298">Назначаване на наставник</text><text x="750" y="317">и седмичен график</text>

    <rect x="340" y="270" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="450" y="298">Ученикът</text><text x="450" y="317">води дневник</text>

    <polygon points="150,240 270,302 150,364 30,302" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/>
    <text x="150" y="298">Наставникът</text><text x="150" y="317">потвърждава</text>
  </g>
  <line x1="640" y1="302" x2="562" y2="302" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="302" x2="272" y2="302" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- отхвърлен: връща се към дневника -->
  <path d="M150,240 C150,205 450,205 450,268" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="226" text-anchor="middle" font-size="12.5" fill="#b91c1c" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">отхвърлен с коментар (коригира се)</text>

  <!-- потвърден -->
  <line x1="150" y1="364" x2="150" y2="438" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="406" font-size="12.5" fill="#15803d">потвърден</text>

  <!-- Ред 3 -->
  <g font-size="13.5" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="440" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="150" y="468">Часовете се броят</text><text x="150" y="487">към нормата</text>

    <rect x="340" y="440" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="450" y="468">Оценка по критерии</text><text x="450" y="487">(скала 2-6)</text>

    <rect x="640" y="440" width="220" height="64" rx="10" fill="#e6f4f4" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="750" y="468">Справка и експорт</text><text x="750" y="487">за координатора</text>
  </g>
  <line x1="260" y1="472" x2="338" y2="472" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="472" x2="638" y2="472" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Легенда -->
  <rect x="40" y="540" width="14" height="14" rx="3" fill="#e6f4f4" stroke="#0f6e6e"/>
  <text x="62" y="552" font-size="12" fill="#334155">действие</text>
  <polygon points="150,540 158,547 150,554 142,547" fill="#fff7e6" stroke="#b45309"/>
  <text x="166" y="552" font-size="12" fill="#334155">решение</text>
  <line x1="250" y1="547" x2="280" y2="547" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288" y="552" font-size="12" fill="#334155">връщане за корекция</text>
</svg>
